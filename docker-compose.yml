services:

  quarterlycompanion:
    build: .
    container_name: quarterlycompanion

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    depends_on:
      - ollama

    volumes:
      - ./data:/app/data

    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G

    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: quarterlycompanion-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

    restart: unless-stopped


volumes:
  ollama_data: